name: update-data

on:
  schedule:
    # 02:23 / 08:23 / 14:23 / 20:23 Asia/Taipei. The source looks like one snapshot a day at an unknown time;
    # off the hour because GitHub delays or drops scheduled runs at :00.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch
        run: python3 scripts/fetch.py

      # Refuses (fails the run, publishes nothing) when the source looks broken.
      - name: Build
        run: python3 scripts/build.py

      - name: Validate
        run: python3 -m unittest discover -s tests

      - name: Commit and push
        run: |
          # stage first: new days are untracked and removed days are deletions
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "data: update $(TZ=Asia/Taipei date '+%F %H:%M')"
          git push

      # Measurement only: does the CDN serve what was just published? jsDelivr caches a branch path for up to 12 h
      # and its purge API is for tagged versions, so we log the delay instead of purging.
      - name: Compare CDN copies
        continue-on-error: true
        run: |
          for f in data/meta.json $(git diff --name-only --diff-filter=AM ${{ github.sha }} HEAD -- data | grep -v meta.json | head -3); do
            for url in "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/$f" \
                       "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$f"; do
              if curl -fsS "$url" | cmp -s - "$f"; then echo "same  $url"; else echo "STALE $url"; fi
            done
          done

      # Measurement only: the checkout is shallow, so ask the API for the repository size (KB).
      - name: Repository size
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "repository size: $(gh api repos/${{ github.repository }} -q .size) KB"

      # GitHub disables the scheduled workflows of a public repository after 60 days without repository activity.
      # Data changes daily, so this only matters if the source stops updating.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt $(( 30 * 86400 )) ]; then
            echo "last commit is recent; nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +%F > .github/keepalive
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%F)"
          git push

      # Runs after publishing: changes the README's notes may no longer describe (seats = 0, new station codes,
      # new source fields) fail the run so that you get notified. The data is already published.
      - name: Drift check
        run: |
          if [ -s .cache/drift.txt ]; then
            cat .cache/drift.txt
            exit 1
          fi
